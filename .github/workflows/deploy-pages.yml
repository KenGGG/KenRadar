name: Deploy KenRadar Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docs/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy generated HTML
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.KENRADAR_PAGES_DEPLOY_KEY }}
          external_repository: KenGGG/KenRadar-pages
          publish_dir: ./docs
          publish_branch: gh-pages
          keep_files: true
          enable_jekyll: false
